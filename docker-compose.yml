services:
  postgres:
    image: postgres:16-alpine
    container_name: abgroup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abgroup}
      POSTGRES_USER: ${POSTGRES_USER:-abgroup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - abgroup-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abgroup} -d ${POSTGRES_DB:-abgroup}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abgroup-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8456}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-abgroup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-abgroup}
      NODE_ENV: production
      UV_THREADPOOL_SIZE: 8
      NODE_OPTIONS: --max-old-space-size=1024
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - abgroup-net

networks:
  abgroup-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
